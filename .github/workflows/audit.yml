name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit backend
        run: npm audit --audit-level=high

      - name: Audit client
        run: npm audit --audit-level=high
        working-directory: ./client
