services:
  habits:
    build:
      context: .
      args:
        - VITE_API_URL=/api
    image: habits-tracker
    container_name: habits
    volumes:
      - /home/lach/configs/habits:/config
    ports:
      - "7160:7160"
    environment:
      - NODE_ENV=production
      - PORT=7160
      - DB_PATH=/config/habits.db
      - SESSION_SECRET_FILE=/config/session_secret.txt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7160/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional Postgres for development / HA work. Not started by default;
  # opt in with `docker compose --profile postgres up -d postgres`.
  # The app only uses it if DATABASE_URL is set (SQLite stays the default).
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=habits
      - POSTGRES_PASSWORD=habits
      - POSTGRES_DB=habits
    ports:
      - "5432:5432"
    volumes:
      - habits-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habits -d habits"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  habits-postgres:
