# PgBouncer in front of the primary. Point the app at the
# "habits-db-pooler-rw" Service (created with the same name as this Pooler).
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: habits-db-pooler-rw
  labels:
    app.kubernetes.io/name: habits-db-pooler-rw
    app.kubernetes.io/part-of: habits
spec:
  cluster:
    name: habits-db
  instances: 2
  type: rw
  pgbouncer:
    # Transaction pooling: server connections are shared between app pods.
    # The app must not depend on session state (SET, LISTEN, session-level
    # advisory locks). Run migrations against habits-db-rw directly.
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
  template:
    spec:
      containers: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: habits-db-pooler-rw
