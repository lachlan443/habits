<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark green background rounded square -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#2e7d32"/>
  <!-- Left ring -->
  <ellipse cx="36" cy="50" rx="16" ry="10" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Right ring -->
  <ellipse cx="64" cy="50" rx="16" ry="10" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Overlap mask so rings interlock -->
  <rect x="47" y="40" width="6" height="20" fill="#2e7d32"/>
</svg>
